<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Rebetta Studio</title>
  <link rel="icon" href="images/LOGO.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #fffaf6;
    }

    .main-container {
      display: flex;
      min-height: 100vh;
    }

    .left-side {
      flex: 2;
      background-image: url('images/stock1.jpg');
      background-size: cover;
      background-position: center;
    }

    .right-side {
      flex: 1;
      background-color: #fffaf6;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 60px;
    }

    .form-wrapper {
      max-width: 420px;
      width: 100%;
      margin-left: 40px;
    }

    .title {
      font-family: 'Georgia', serif;
      font-size: 4rem;
      color: #7d6666;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #000;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .form-label {
      color: #000;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      height: 60px;
      font-size: 1.1rem;
      padding: 0 20px;
      border-radius: 8px;
      border: 1px solid #e6e6e6;
      margin-bottom: 20px;
      background-color: #f8f9fa;
    }

    .form-control:focus {
      border-color: #d4b2a7;
      box-shadow: 0 0 0 0.25rem rgba(212, 178, 167, 0.25);
      background-color: #fff;
    }

    ::placeholder {
      color: #b89b9b;
      opacity: 0.9;
    }

    .field-row {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .field-row .form-group {
      flex: 1;
    }

    .field-row .form-group .form-control {
      margin-bottom: 0;
    }

    .btn-login {
      background-color: #d4b2a7;
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: #b59289;
    }

    .btn-login:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-check-label {
      color: #7d6666;
      font-size: 0.95rem;
    }

    .bottom-link {
      text-align: center;
      margin-top: 25px;
      color: #7d6666;
      font-size: 0.95rem;
    }

    .bottom-link a {
      color: #d4b2a7;
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }
    
    .password-error, .error-message {
      color: #dc3545;
      font-size: 0.875em;
      margin-top: -15px;
      margin-bottom: 15px;
      display: none;
    }

    .success-message {
      color: #28a745;
      font-size: 0.875em;
      margin-bottom: 15px;
      display: none;
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #d4b2a7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Animations */
    .fade-in-up {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease, transform 1s ease;
    }
   
    .fade-in-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
   
    .fade-in-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
   
    .fade-in-left.visible {
      opacity: 1;
      transform: translateX(0);
    }
   
    .fade-in-right {
      opacity: 0;
      transform: translateX(40px);
      transition: opacity 1.4s ease, transform 1.4s ease;
    }
   
    .fade-in-right.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .title-animation {
      opacity: 0;
      transform: scale(0.8) translateY(-20px);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }

    .title-animation.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .left-side {
        height: 250px;
      }

      .right-side {
        justify-content: center;
        padding: 30px;
        text-align: center;
      }

      .form-wrapper {
        margin-left: 0;
        padding: 0 20px;
      }

      .field-row {
        flex-direction: column;
        gap: 0;
      }

      .field-row .form-group .form-control {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="left-side"></div>
    <div class="right-side">
      <div class="form-wrapper">
        <div class="title text-center title-animation">Rebetta Pilates</div>
        <div class="subtitle fade-in-up">¡Únete a la comunidad!</div>
        
        <!-- General error/success messages -->
        <div id="generalError" class="error-message"></div>
        <div id="generalSuccess" class="success-message"></div>
        
        <form id="registroForm">
          <div class="field-row fade-in-left">
            <div class="form-group">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required />
            </div>
            <div class="form-group">
              <label for="apellido-paterno" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="apellido-paterno" placeholder="Tu apellido" required />
            </div>
          </div>

          <div class="field-row fade-in-right">
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required />
            </div>
            <div class="form-group">
              <label for="fecha-nac" class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" id="fecha-nac" required />
            </div>
          </div>

          <div class="mb-3 fade-in-left">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="********" required />
            <div id="passwordError" class="password-error"></div>
          </div>

          <div class="mb-3 fade-in-right">
            <label for="confirmar-password" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" id="confirmar-password" placeholder="********" required />
            <div id="confirmPasswordError" class="password-error"></div>
          </div>

          <div class="form-row fade-in-up">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Recordarme</label>
            </div>
          </div>

          <button type="submit" class="btn-login fade-in-up" id="submitBtn">
            <span id="btnText">Crear Cuenta</span>
            <div class="loading-spinner" id="loadingSpinner"></div>
          </button>
          
          <div class="bottom-link fade-in-up">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Get API URL based on environment
    function getApiUrl() {
      const currentHost = window.location.hostname;
      if (currentHost === 'localhost' || currentHost === '127.0.0.1') {
        return 'http://localhost:5000/api';
      }
      return '/api'; // Relative URL for production
    }
    
    const API_URL = getApiUrl();
    
    // List of allowed email domains (legitimate providers)
    const ALLOWED_EMAIL_DOMAINS = [
      // Global providers
      'gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'live.com', 
      'icloud.com', 'me.com', 'mac.com', 'aol.com', 'protonmail.com', 
      'proton.me', 'zoho.com', 'yandex.com', 'mail.com', 'gmx.com',
      
      // Microsoft domains
      'msn.com', 'hotmail.co.uk', 'outlook.es', 'outlook.fr',
      
      // Regional providers - Mexico
      'prodigy.net.mx', 'telmex.com', 'axtel.net', 
      
      // Regional providers - Spain  
      'terra.com', 'telefonica.net', 'ono.com', 'orange.es', 'movistar.es',
      
      // Regional providers - Latin America
      'uol.com.br', 'bol.com.br', 'terra.com.br', // Brazil
      'speedy.com.ar', 'fibertel.com.ar', 'arnet.com.ar', // Argentina
      'vtr.net', 'tie.cl', // Chile
      'une.net.co', 'etb.net.co', // Colombia
      
      // Educational (common patterns)
      'edu', 'edu.mx', 'ac.uk', 'edu.co',
      
      // Business domains (for professional emails)
      'company.com', 'corporate.com'
    ];

    // Extended list of disposable/temporary email providers to block
    const BLOCKED_EMAIL_DOMAINS = [
      'test.com', 'example.com', 'temp-mail.org', '10minutemail.com',
      'guerrillamail.com', 'mailinator.com', 'maildrop.cc', 'throwaway.email',
      'yopmail.com', 'tempmail.com', 'trashmail.com', 'sharklasers.com',
      'guerrillamail.info', 'grr.la', 'guerrillamail.biz', 'guerrillamail.org',
      'guerrillamailblock.com', 'pokemail.net', 'spam4.me', 'fakeinbox.com',
      'emailondeck.com', 'getnada.com', 'mailnesia.com', 'mintemail.com',
      'tempinbox.com', 'disposablemail.com', 'throwawaymail.com', 'tmpmail.net'
    ];

    // Function to validate email domain
    function isValidEmailDomain(email) {
      const domain = email.toLowerCase().split('@')[1];
      if (!domain) return false;
      
      // Check if it's explicitly blocked
      if (BLOCKED_EMAIL_DOMAINS.includes(domain)) {
        return false;
      }
      
      // Check for educational domains (allow any .edu)
      if (domain.endsWith('.edu') || domain.endsWith('.edu.mx') || 
          domain.endsWith('.ac.uk') || domain.endsWith('.edu.co')) {
        return true;
      }
      
      // Check for corporate domains (basic pattern)
      // Allow emails that look like corporate domains (e.g., name@company.com.mx)
      const domainParts = domain.split('.');
      if (domainParts.length >= 2) {
        const tld = domainParts.slice(-2).join('.');
        const validTLDs = ['com.mx', 'co.uk', 'com.br', 'com.ar', 'net.mx', 'org.mx'];
        if (validTLDs.includes(tld) && !BLOCKED_EMAIL_DOMAINS.includes(domain)) {
          return true; // Allow regional corporate domains
        }
      }
      
      // Check if it's in the allowed list
      return ALLOWED_EMAIL_DOMAINS.includes(domain);
    }

    // Animation observer
    document.addEventListener('DOMContentLoaded', () => {
      const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, observerOptions);

      const fadeElements = document.querySelectorAll('.fade-in-up, .fade-in-left, .fade-in-right, .title-animation');
      fadeElements.forEach(el => observer.observe(el));
    });

    // Form validation and submission
    document.getElementById('registroForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      // Get form elements
      const emailInput = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmar-password');
      const passwordError = document.getElementById('passwordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');
      const generalError = document.getElementById('generalError');
      const generalSuccess = document.getElementById('generalSuccess');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      
      const emailValue = emailInput.value.toLowerCase();
      const passwordValue = password.value;
      const specialCharRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/;

      let isValid = true;
      
      // Reset all error messages
      passwordError.textContent = '';
      passwordError.style.display = 'none';
      confirmPasswordError.textContent = '';
      confirmPasswordError.style.display = 'none';
      generalError.textContent = '';
      generalError.style.display = 'none';
      generalSuccess.style.display = 'none';
      password.style.borderColor = '#e6e6e6';
      confirmPassword.style.borderColor = '#e6e6e6';
      emailInput.style.borderColor = '#e6e6e6';

      // Email validation
      if (!isValidEmailDomain(emailValue)) {
        const domain = emailValue.split('@')[1];
        if (domain && BLOCKED_EMAIL_DOMAINS.includes(domain)) {
          generalError.textContent = 'Por favor usa un correo electrónico real. Los correos temporales no están permitidos.';
        } else {
          generalError.textContent = 'Por favor usa un proveedor de correo válido (Gmail, Yahoo, Outlook, etc.)';
        }
        generalError.style.display = 'block';
        emailInput.style.borderColor = '#dc3545';
        isValid = false;
      }

      // Client-side validation
      // 1. Check password length
      if (passwordValue.length < 8) {
        passwordError.textContent = 'La contraseña debe tener al menos 8 caracteres.';
        passwordError.style.display = 'block';
        password.style.borderColor = '#dc3545';
        isValid = false;
      } 
      // 2. Check for special character
      else if (!specialCharRegex.test(passwordValue)) {
        passwordError.textContent = 'La contraseña debe contener al menos un carácter especial (ej. !@#$%^&*).';
        passwordError.style.display = 'block';
        password.style.borderColor = '#dc3545';
        isValid = false;
      }
      
      // 3. Check if passwords match
      if (password.value !== confirmPassword.value) {
        confirmPasswordError.textContent = 'Las contraseñas no coinciden.';
        confirmPasswordError.style.display = 'block';
        confirmPassword.style.borderColor = '#dc3545';
        isValid = false;
      }

      // If validation fails, stop here
      if (!isValid) {
        return;
      }

      // Prepare data for backend
      const formData = {
        name: `${document.getElementById('nombre').value} ${document.getElementById('apellido-paterno').value}`,
        email: emailValue,
        password: passwordValue,
        dob: document.getElementById('fecha-nac').value
      };

      // Show loading state
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      loadingSpinner.style.display = 'block';

      try {
        // Send to backend
        const response = await fetch(`${API_URL}/users/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          // Success! Store tokens
          localStorage.setItem('token', data.token);
          localStorage.setItem('refreshToken', data.refreshToken);
          localStorage.setItem('userName', formData.name);
          
          // Show success message
          generalSuccess.textContent = '¡Cuenta creada exitosamente! Redirigiendo...';
          generalSuccess.style.display = 'block';
          
          // Redirect to dashboard after 2 seconds
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 2000);
        } else {
          // Handle backend errors
          if (data.details) {
            // Specific field errors from backend
            if (data.details.email) {
              generalError.textContent = data.details.email;
            } else if (data.details.password) {
              passwordError.textContent = data.details.password;
              passwordError.style.display = 'block';
              password.style.borderColor = '#dc3545';
            } else if (data.details.dob) {
              generalError.textContent = data.details.dob;
            } else {
              generalError.textContent = Object.values(data.details).join('. ');
            }
          } else {
            generalError.textContent = data.error || 'Error al crear la cuenta. Por favor intenta de nuevo.';
          }
          generalError.style.display = 'block';
        }
      } catch (error) {
        console.error('Registration error:', error);
        generalError.textContent = 'Error de conexión con el servidor. Por favor intenta más tarde.';
        generalError.style.display = 'block';
      } finally {
        // Reset button state
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        loadingSpinner.style.display = 'none';
      }
    });

    // Real-time email validation feedback
    document.getElementById('email').addEventListener('blur', function() {
      const emailValue = this.value.toLowerCase();
      const generalError = document.getElementById('generalError');
      
      if (emailValue && !isValidEmailDomain(emailValue)) {
        const domain = emailValue.split('@')[1];
        if (domain && BLOCKED_EMAIL_DOMAINS.includes(domain)) {
          generalError.textContent = 'Los correos temporales no están permitidos. Usa tu correo personal.';
        } else {
          generalError.textContent = 'Por favor usa un correo de Gmail, Yahoo, Outlook, etc.';
        }
        generalError.style.display = 'block';
        this.style.borderColor = '#dc3545';
      } else if (emailValue && isValidEmailDomain(emailValue)) {
        generalError.style.display = 'none';
        this.style.borderColor = '#28a745';
      }
    });

    // Clear email error when user starts typing
    document.getElementById('email').addEventListener('input', function() {
      const generalError = document.getElementById('generalError');
      if (generalError.textContent.includes('correo')) {
        generalError.style.display = 'none';
        this.style.borderColor = '#e6e6e6';
      }
    });

    // Real-time password validation feedback
    document.getElementById('password').addEventListener('input', function() {
      const passwordError = document.getElementById('passwordError');
      const specialCharRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/;
      
      if (this.value.length > 0 && this.value.length < 8) {
        passwordError.textContent = 'La contraseña debe tener al menos 8 caracteres.';
        passwordError.style.display = 'block';
        this.style.borderColor = '#dc3545';
      } else if (this.value.length >= 8 && !specialCharRegex.test(this.value)) {
        passwordError.textContent = 'La contraseña debe contener al menos un carácter especial.';
        passwordError.style.display = 'block';
        this.style.borderColor = '#dc3545';
      } else if (this.value.length >= 8 && specialCharRegex.test(this.value)) {
        passwordError.style.display = 'none';
        this.style.borderColor = '#28a745';
      } else {
        passwordError.style.display = 'none';
        this.style.borderColor = '#e6e6e6';
      }
    });

    // Real-time password confirmation validation
    document.getElementById('confirmar-password').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirmPasswordError = document.getElementById('confirmPasswordError');
      
      if (this.value.length > 0 && this.value !== password) {
        confirmPasswordError.textContent = 'Las contraseñas no coinciden.';
        confirmPasswordError.style.display = 'block';
        this.style.borderColor = '#dc3545';
      } else if (this.value === password && password.length > 0) {
        confirmPasswordError.style.display = 'none';
        this.style.borderColor = '#28a745';
      } else {
        confirmPasswordError.style.display = 'none';
        this.style.borderColor = '#e6e6e6';
      }
    });
  </script>
</body>
</html>
