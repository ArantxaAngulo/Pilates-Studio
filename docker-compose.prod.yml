version: '3.8'

services:
  app:
    environment:
      - NODE_ENV=production
    volumes: []  # Remove development volume mounts
    restart: always
    
  mongo:
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secure_password_here
    restart: always
    
  # Remove mongo-express in production
  mongo-express:
    profiles:
      - development