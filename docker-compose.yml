version: '3.8'

services:
  # Main application
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/pilates-studio
    depends_on:
      - mongo
    volumes:
      # Mount source code for development (remove in production)
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - pilates-network

  # MongoDB database
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=pilates-studio
    volumes:
      - mongo_data:/data/db
      # Initialize with seed data if needed
      - ./seed:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - pilates-network

  # MongoDB Admin Interface (optional)
  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - pilates-network

volumes:
  mongo_data:

networks:
  pilates-network:
    driver: bridge